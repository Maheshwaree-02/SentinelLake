# ============================================================
# docker-compose.yml – Enterprise Fraud Detection Platform
# ============================================================
# Services:
#   fastapi  – The fraud-detection REST API (port 8000)
#   postgres – PostgreSQL 15 database (port 5432)
# ============================================================

version: "3.9"

services:
  # ---------- FastAPI application ----------
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: fraud_platform
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass
    depends_on:
      postgres:
        condition: service_started
    restart: unless-stopped

  # ---------- PostgreSQL database ----------
  postgres:
    image: postgres:15-alpine
    container_name: fraud-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fraud_platform
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
